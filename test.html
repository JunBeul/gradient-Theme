<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenkeyless Keyboard</title>
    <style>
        :root{
            --size-1u: calc(100% / 18.5);
            --color-text: #000;
        }
        .container{
            display: inline-block;
        }
        .typing-text{
            text-align: center;
            font-size: 2em;
        }

        .keyboard-box {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            border: 2px solid var(--color-text);
            border-radius: 10px;
        }

        .tenkeyless-keyboard {
            display: flex;
            width: 1000px;
            flex-direction: column;
            padding: 10px;
            background-color: transparent;
        }

        .row {
            display: flex;
        }

        .row-spacer {
            width: var(--size-1u);
            aspect-ratio: 2.75 / 1;
        }

        .key {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            color: var(--color-text);
            border: 3px solid #ffffff00;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            text-transform: uppercase;
            position:relative;
        }

        .key::before {
            content: "";
            position: absolute;
            top: 0px;
            left: 0px;
            right: 0px;
            bottom: 0px;
            border-radius: 5px;
            border: 2px solid var(--color-text);
            background-color: transparent;
            transition: background-color 0.1s;
        }

        .key.active::before {
            background-color: var(--color-text);
        }

        .key.size-1u {
            width: var(--size-1u);
            aspect-ratio: 1 / 1;
        }

        .key.size-1_25u {
            width: calc(var(--size-1u) * 1.25);
        }

        .key.size-1_5u {
            width: calc(var(--size-1u) * 1.5);
        }

        .key.size-1_75u {
            width: calc(var(--size-1u) * 1.75);
        }

        .key.size-2u {
            width: calc(var(--size-1u) * 2);
        }

        .key.size-2_25u {
            width: calc(var(--size-1u) * 2.25);
        }

        .key.size-2_75u {
            width: calc(var(--size-1u) * 2.75);
        }

        .key.size-6_25u {
            width: calc(var(--size-1u) * 6.25);
        }

        .gap {
            width: calc(var(--size-1u) * 0.5);
        }
        .gap.size-1u {
            width: var(--size-1u);
        }
        .gap.size-0_75u {
            width: calc(var(--size-1u) * 0.666);
        }
        svg{
            fill: var(--color-text);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="typing-text"></div>
        <div class="keyboard-box">
            <div class="tenkeyless-keyboard">
                <!-- Row 1 -->
                <div class="row">
                    <div class="key size-1u" data-key="Escape">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-escape" viewBox="0 0 16 16">
                            <path d="M8.538 1.02a.5.5 0 1 0-.076.998 6 6 0 1 1-6.445 6.444.5.5 0 0 0-.997.076A7 7 0 1 0 8.538 1.02"/>
                            <path d="M7.096 7.828a.5.5 0 0 0 .707-.707L2.707 2.025h2.768a.5.5 0 1 0 0-1H1.5a.5.5 0 0 0-.5.5V5.5a.5.5 0 0 0 1 0V2.732z"/>
                        </svg>
                    </div>
                    <div class="gap size-1u"></div>
                    <div class="key size-1u" data-key="F1">F1</div>
                    <div class="key size-1u" data-key="F2">F2</div>
                    <div class="key size-1u" data-key="F3">F3</div>
                    <div class="key size-1u" data-key="F4">F4</div>
                    <div class="gap size-0_75u"></div>
                    <div class="key size-1u" data-key="F5">F5</div>
                    <div class="key size-1u" data-key="F6">F6</div>
                    <div class="key size-1u" data-key="F7">F7</div>
                    <div class="key size-1u" data-key="F8">F8</div>
                    <div class="gap size-0_75u"></div>
                    <div class="key size-1u" data-key="F9">F9</div>
                    <div class="key size-1u" data-key="F10">F10</div>
                    <div class="key size-1u" data-key="F11">F11</div>
                    <div class="key size-1u" data-key="F12">F12</div>
                    <div class="gap"></div>
                    <div class="key size-1u" data-key="PrintScreen">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-printer-fill" viewBox="0 0 16 16">
                            <path d="M5 1a2 2 0 0 0-2 2v1h10V3a2 2 0 0 0-2-2zm6 8H5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1"/>
                            <path d="M0 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2H2a2 2 0 0 1-2-2zm2.5 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
                        </svg>
                    </div>
                    <div class="key size-1u" data-key="ScrollLock">

                            <path d="M11 1a2 2 0 0 0-2 2v4a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h5V3a3 3 0 0 1 6 0v4a.5.5 0 0 1-1 0V3a2 2 0 0 0-2-2"/>
                        </svg>
                    </div>
                    <div class="key size-1u" data-key="Pause">

                        </svg>
                    </div>
                </div>

                <!-- Spacer Row -->
                <div class="row-spacer"></div>

                <!-- Row 2 -->
                <div class="row">
                    <div class="key size-1u" data-key="Backquote">`</div>
                    <div class="key size-1u" data-key="Digit1">1</div>
                    <div class="key size-1u" data-key="Digit2">2</div>
                    <div class="key size-1u" data-key="Digit3">3</div>
                    <div class="key size-1u" data-key="Digit4">4</div>
                    <div class="key size-1u" data-key="Digit5">5</div>
                    <div class="key size-1u" data-key="Digit6">6</div>
                    <div class="key size-1u" data-key="Digit7">7</div>
                    <div class="key size-1u" data-key="Digit8">8</div>
                    <div class="key size-1u" data-key="Digit9">9</div>
                    <div class="key size-1u" data-key="Digit0">0</div>
                    <div class="key size-1u" data-key="Minus">-</div>
                    <div class="key size-1u" data-key="Equal">=</div>
                    <div class="key size-2u" data-key="Backspace">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-backspace-fill" viewBox="0 0 16 16">

                        </svg>
                    </div>
                    <div class="gap"></div>
                    <div class="key size-1u" data-key="Insert">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                            <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>

                    <div class="key size-1u" data-key="Home">

                        </svg>
                    </div>
                    <div class="key size-1u" data-key="KeyQ">Q</div>
                    <div class="key size-1u" data-key="KeyW">W</div>
                    <div class="key size-1u" data-key="KeyE">E</div>
                    <div class="key size-1u" data-key="KeyR">R</div>
                    <div class="key size-1u" data-key="KeyT">T</div>
                    <div class="key size-1u" data-key="KeyY">Y</div>
                    <div class="key size-1u" data-key="KeyU">U</div>

                    <div class="key size-1u" data-key="KeyO">O</div>
                    <div class="key size-1u" data-key="KeyP">P</div>

                    <div class="key size-1u" data-key="BracketRight">]</div>
                    <div class="key size-1_5u" data-key="Backslash">\</div>
                    <div class="gap"></div>
                    <div class="key size-1u" data-key="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">

                        </svg>
                    </div>
                </div>

                <!-- Row 4 -->
                <div class="row">
                    <div class="key size-1_75u" data-key="CapsLock">

                    <div class="key size-1_25u" data-key="AltRight">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-alt" viewBox="0 0 16 16">
                            <path d="M1 13.5a.5.5 0 0 0 .5.5h3.797a.5.5 0 0 0 .439-.26L11 3h3.5a.5.5 0 0 0 0-1h-3.797a.5.5 0 0 0-.439.26L5 13H1.5a.5.5 0 0 0-.5.5m10 0a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 0-1h-3a.5.5 0 0 0-.5.5"/>

                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-microsoft" viewBox="0 0 16 16">
                            <path d="M7.462 0H0v7.19h7.462zM16 0H8.538v7.19H16zM7.462 8.211H0V16h7.462zm8.538 0H8.538V16H16z"/>
                        </svg>
                    </div>
                    <div class="key size-1_25u" data-key="ContextMenu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-justify" viewBox="0 0 16 16">

    <script>
let activeKey = null; // Track the currently active key
let typingTask = null; // Track the current typing task
let cancelTyping = false; // Flag to cancel typing

function keySound() {
    const context = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = context.createOscillator();
    const gainNode = context.createGain();

    oscillator.type = 'square';
    oscillator.frequency.setValueAtTime(680, context.currentTime); // Frequency in Hz
    oscillator.connect(gainNode);
    gainNode.connect(context.destination);

    gainNode.gain.setValueAtTime(0.1, context.currentTime); // Set volume
    oscillator.start();
    oscillator.stop(context.currentTime + 0.2); // Beep for 0.2 seconds
}

// Function to handle keydown event
function handleKeydown(event) {
    if (activeKey === event.code) return;

    const keyElement = document.querySelector(`.key[data-key="${event.code}"]`);
    if (keyElement) {
        keyElement.classList.add('active');
        activeKey = event.code;

        const switchSound = new Audio('https://assets.codepen.io/605876/click.mp3');
        switchSound.play();

        // Automatically release the key after 0.5 seconds
        setTimeout(() => {
            keyElement.classList.remove('active');
            if (activeKey === event.code) {
                activeKey = null;
            }
        }, 500);
    }
}

document.addEventListener('keydown', handleKeydown);

document.addEventListener('keyup', (event) => {
    const keyElement = document.querySelector(`.key[data-key="${event.code}"]`);
    if (keyElement) {
        keyElement.classList.remove('active');
        if (activeKey === event.code) {
            activeKey = null; // Reset active key only if it matches the released key
        }
    }
});

// Function to simulate a keydown event with a string input
function simulateKeyEvent(keyCode) {
    const event = new KeyboardEvent('keydown', { code: keyCode });
    handleKeydown(event);
}

// Function to simulate typing a string one character at a time
async function simulateTyping(text, interval = 500) {
    // Cancel any ongoing typing task
    if (typingTask) {
        cancelTyping = true; // Set the cancel flag
        await typingTask; // Wait for the current task to cancel
        cancelTyping = false; // Reset the cancel flag
        setTimeout(function() {}, 500);
    }

    typingTask = (async () => {
        const specialCharMap = {
            '!': 'Digit1',
            '@': 'Digit2',
            '#': 'Digit3',
            '$': 'Digit4',
            '%': 'Digit5',
            '^': 'Digit6',
            '&': 'Digit7',
            '*': 'Digit8',
            '(': 'Digit9',
            ')': 'Digit0'
        };

        const typingTextElement = document.querySelector('.typing-text');
        if (!typingTextElement) return;

        typingTextElement.textContent = ''; // Clear the typing text element

        for (const char of text) {
            if (cancelTyping) return; // Exit if cancel flag is set

            const isUpperCase = char === char.toUpperCase() && /[A-Z]/.test(char);
            const isSpecialChar = specialCharMap.hasOwnProperty(char);

            if (isUpperCase || isSpecialChar) {
                simulateKeyEvent('ShiftLeft'); // Simulate pressing the left Shift key
                await new Promise(resolve => setTimeout(resolve, interval / 2));
            }

            if (isSpecialChar) {
                simulateKeyEvent(specialCharMap[char]); // Simulate pressing the corresponding number key
            } else if (char === ' ') {
                simulateKeyEvent('Space'); // Simulate pressing the Spacebar
            } else {
                const keyCode = `Key${char.toUpperCase()}`; // Map character to keyCode
                simulateKeyEvent(keyCode);
            }

            typingTextElement.textContent += char; // Append the character to the typing text element

            await new Promise(resolve => setTimeout(resolve, interval));

            if (isUpperCase || isSpecialChar) {
                const shiftKeyElement = document.querySelector(`.key[data-key="ShiftLeft"]`);
                if (shiftKeyElement) {
                    shiftKeyElement.classList.remove('active');
                    activeKey = null;
                }
            }
        }

        // Wait for 1 second before simulating the Enter key
        await new Promise(resolve => setTimeout(resolve, 1000));

        if (cancelTyping) return; // Exit if cancel flag is set

        // Simulate pressing the Enter key at the end
        simulateKeyEvent('Enter');

        // Wait for 0.2 seconds before repeating the typing
        await new Promise(resolve => setTimeout(resolve, 200));

        if (cancelTyping) return; // Exit if cancel flag is set

        // Immediately clear the text and repeat the typing
        typingTextElement.textContent = ''; // Clear the text
        simulateTyping(text, interval);
    })();
}

simulateTyping('New String', 500);
setTimeout(function() { 
    simulateTyping('First String', 500)
}, 1200);
// 실행 중간에 새 입력으로 기존 작업 취소
    </script>
